[project]
name = "ai-hinge-photo-curator"
version = "0.1.0"
description = "Pick Hinge photos from a Google Photos export with pairwise AI judgments"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "imagehash>=4.3",
    "numpy>=1.26",
    "opencv-python-headless>=4.8,<5",
    "pillow>=10.4",
    "pillow-heif>=0.18",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
